# DynamoDB table — injected by SAM as USERS_TABLE_NAME env var
users.table-name=${USERS_TABLE_NAME:CatalystFlow_Users}

# Cognito User Pool — injected by SAM as COGNITO_USER_POOL_ID env var
cognito.user-pool-id=${COGNITO_USER_POOL_ID:ap-southeast-2_CONFIGURE}

# DynamoDB client config
quarkus.dynamodb.aws.region=${AWS_DEFAULT_REGION:ap-southeast-2}
quarkus.dynamodb.devservices.enabled=false
# Async client uses Netty so fan-out writes (assignTeamMembers) run in parallel.
# Sync client still uses url-connection-client (default).
quarkus.dynamodb.async-client.type=netty

# Cognito User Pools client config (managed by quarkus-amazon-cognito-user-pools extension)
quarkus.cognito-user-pools.aws.region=${AWS_DEFAULT_REGION:ap-southeast-2}
quarkus.cognito-user-pools.devservices.enabled=false

# Jackson — exclude null fields from JSON responses (matches generated model expectations)
quarkus.jackson.serialization-inclusion=non-null
