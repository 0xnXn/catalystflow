# notification-service owns notification intent APIs, deterministic job creation,
# and delivery job enqueueing. Email delivery itself runs in notification-worker.

quarkus.dynamodb.aws.region=${AWS_DEFAULT_REGION:ap-southeast-2}
quarkus.dynamodb.devservices.enabled=false
quarkus.sqs.aws.region=${AWS_DEFAULT_REGION:ap-southeast-2}
quarkus.sqs.devservices.enabled=false

notification-jobs.table-name=${NOTIFICATION_JOBS_TABLE_NAME:CatalystFlow_NotificationJobs}
notification-jobs.queue-url=${NOTIFICATION_JOBS_QUEUE_URL:}

reviews.table-name=${REVIEWS_TABLE_NAME:CatalystFlow_Reviews}
review-cycles.table-name=${REVIEW_CYCLES_TABLE_NAME:CatalystFlow_ReviewCycles}
users.table-name=${USERS_TABLE_NAME:CatalystFlow_Users}

notification.start-reminder-offsets-days=${NOTIFICATION_START_REMINDER_OFFSETS_DAYS:7,0}
notification.end-reminder-offsets-days=${NOTIFICATION_END_REMINDER_OFFSETS_DAYS:14,7,3,1,0}
notification.job-ttl-days=${NOTIFICATION_JOB_TTL_DAYS:90}
notification.app-base-url=${NOTIFICATION_APP_BASE_URL:https://catalystflow.example.com}
