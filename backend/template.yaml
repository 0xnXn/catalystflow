  # ---------------------------------------------------------------------------
  # Lambda: AI Service
  # Handles all /ai-review/* routes — split from review-service in Epic 5 G1.
  # Sync execution today (still bound by API Gateway 29s timeout).
  # G2 (deferred) replaces API-Gateway integration with SQS-triggered worker.
  # ---------------------------------------------------------------------------
  AiServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !If [IsProd, "CatalystFlow-AiService", "CatalystFlow-AiService-dev"]
      CodeUri: ai-service/target/function.zip
      Timeout: 29
      Environment:
        Variables:
          AI_JOBS_TABLE_NAME: !Ref AiJobsTable
          # G2 step 3: API now enqueues jobs for AiWorkerFunction to process
          # asynchronously. GEMINI_API_KEY stays for the in-process fallback
          # path (used only if AI_JOBS_QUEUE_URL is empty — never in deployed
          # environments).
          AI_JOBS_QUEUE_URL: !Ref AiJobsQueue
          GEMINI_API_KEY: !Ref GeminiApiKey
          # Global Gemini model fallback. ModelResolver reads the per-task vars
          # below first; if a per-task var is unset it falls through to this;
          # if even GEMINI_MODEL is unset, application.properties supplies a
          # literal "gemini-2.5-flash" default. Behavior is byte-identical to
          # the pre-resolver world when only this var is set.
          GEMINI_MODEL: "gemini-2.5-flash"
          # Per-task Gemini model selection (Phase 2 — flipped 2026-05-27
          # after dev gate verified 20/20 ANALYZE calls succeeded on
          # gemini-3.1-flash-lite with 0 SchemaInvalidException, cachedContents
          # API confirmed working, thinkingBudget accepted). CacheRequest.model
          # is part of the cacheKey hash, so each flipped task invalidates its
          # DDB cache rows on the next call (~1h TTL, intentional).
          #
          # GOLDEN runs on gemini-3.5-flash rather than gemini-2.5-pro: 3.x
          # Pro is still preview-only (not for prod), and 3.5-flash is the
          # newest GA mid-tier model. Quality vs 2.5-pro is the open
          # question — watch SchemaInvalidException rate + manager feedback.
          GEMINI_MODEL_ANALYZE: "gemini-3.1-flash-lite"
          # INSIGHTS reverted to gemini-2.5-flash (2026-06-02): 3.5-flash's STREAMING
          # endpoint is overloaded and aborts mid-stream with a 503, which surfaced as
          # terminal MALFORMED (blank self-review Golden Mirror). 2.5-flash streams
          # reliably; the mid-stream-503 handling added to GeminiClient.callStreaming
          # is the durable, model-agnostic fix. INSIGHTS, GOLDEN and DIGEST all
          # STREAM (GeminiClient.callStreaming), so all three are reverted to
          # 2.5-flash (2026-06-02) to avoid the overload-driven mid-stream 503.
          # QUESTION_SUGGEST moved to 3.1-flash-lite (2026-06-06): non-streaming
          # call() path (no mid-stream 503 risk), faster + cheaper than 3.5-flash,
          # which showed ~37s latency spikes. Fallback below stays 2.5-flash.
          GEMINI_MODEL_INSIGHTS: "gemini-2.5-flash"
          GEMINI_MODEL_GOLDEN: "gemini-2.5-flash"
          GEMINI_MODEL_QUESTION_SUGGEST: "gemini-3.1-flash-lite"
          GEMINI_MODEL_DIGEST: "gemini-2.5-flash"
          # SPEC-503: per-task FALLBACK model, re-run on an SQS redelivery after a
          # transient upstream 5xx. Uniformly gemini-2.5-flash (older GA model on a
          # separate, higher-headroom pool — the overload escape). Keep in lockstep
          # with the AiWorkerFunction block below.
          GEMINI_MODEL_ANALYZE_FALLBACK: "gemini-2.5-flash"
          GEMINI_MODEL_INSIGHTS_FALLBACK: "gemini-2.5-flash"
          GEMINI_MODEL_GOLDEN_FALLBACK: "gemini-2.5-flash"
          GEMINI_MODEL_QUESTION_SUGGEST_FALLBACK: "gemini-2.5-flash"
          GEMINI_MODEL_DIGEST_FALLBACK: "gemini-2.5-flash"
          AI_REVIEW_MOCK: "false"
          # Manager guidance endpoints read reviews and templates to build review context
          REVIEWS_TABLE_NAME: !Ref ReviewsTable
          REVIEW_TEMPLATES_TABLE_NAME: !Ref ReviewTemplatesTable
          # CC-1: Gemini context-cache index. GeminiCacheService reads/writes
          # this table when resolving a cacheKey to a Gemini cachedContents/<id>.
          GEMINI_CACHE_TABLE_NAME: !Ref GeminiContextCacheTable
          # CC-4a: per-task cache-enable flag. 2026-05-27: previously gated by
          # !If [IsProd, "false", "true"] to keep prod uncached during rollout;
          # flipped to "true" uniformly after dev showed the cache path works.
          # Each flag can still be rolled back via env-var override (no code
          # redeploy) if a single task type regresses.
          GEMINI_CACHE_ENABLED_QUESTION_SUGGEST: "true"
          # CC-4b: MANAGER_GOLDEN caches the system prompt only (no
          # discipline/seniority split; corpus is per-job). Today's
          # GOLDEN_REVIEW_PROMPT (~700 tokens) is below the 1500-token
          # preflight threshold so flipping this ON is currently a no-op —
          # countTokens skips cache create, GeminiClient falls through to
          # uncached. Wiring is in place so the cache lights up automatically
          # if the prompt grows past the threshold.
          GEMINI_CACHE_ENABLED_GOLDEN: "true"
          # CC-4b: PEER_360_DIGEST mirrors GOLDEN — system prompt only,
          # ~300 tokens, same no-op-today caveat.
          GEMINI_CACHE_ENABLED_DIGEST: "true"
          # CC-4c: ANALYZE + INSIGHTS — per-(discipline, seniority) prefix
          # (criteria + style + task instructions). Several thousand tokens
          # each, well above the 1500-token preflight threshold, so flipping
          # these flags ON activates real caching (unlike GOLDEN/DIGEST which
          # stay below threshold). §D5 TTLs: ANALYZE 1h, INSIGHTS 30 min.
          GEMINI_CACHE_ENABLED_ANALYZE: "true"
          GEMINI_CACHE_ENABLED_INSIGHTS: "true"
          # CC-5 (AC-11.2): tag the CloudWatch EMF metric's Stage dimension
          # so the CatalystFlow-Ai-CacheHitRate-Low alarm can be filtered per
          # environment in dashboards.
          CATALYSTFLOW_STAGE: !Ref Environment
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AiJobsTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt AiJobsQueue.QueueName
        - DynamoDBReadPolicy:
            TableName: !Ref ReviewsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ReviewTemplatesTable
        # CC-1: Get/Put/Delete on the cache index. CrudPolicy grants the full
        # set; CC-2's GeminiCacheService uses GetItem + PutItem; CC-6 admin
        # endpoints add DeleteItem for manual cache eviction.
        - DynamoDBCrudPolicy:
            TableName: !Ref GeminiContextCacheTable
      Events:
        AiReviewDisciplines:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /ai-review/disciplines
            Method: GET
        AiReviewAnalyze:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /ai-review/analyze
            Method: POST
        AiReviewAnalyzeStatus:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /ai-review/analyze/{jobId}/status
            Method: GET
        AiReviewInsights:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /ai-review/insights
            Method: POST
        AiReviewInsightsStatus:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /ai-review/insights/{jobId}/status
            Method: GET
        ManagerReviewGoldenPost:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /ai-review/manager/reviews/{reviewId}/golden
            Method: POST
        ManagerReviewQuestionSuggest:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /ai-review/manager/reviews/{reviewId}/question-suggest
            Method: POST
        # Polling endpoint shared by every manager-side async flow (analyze /
        # golden / question-suggest / peer360-digest). Without this, the
        # frontend's pollUntilDone hits API Gateway and gets 403; UI hangs
        # until its 5-minute timeout.
        ManagerJobsStatus:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /ai-review/manager/jobs/{jobId}/status
            Method: GET
        # ADR-2 peer-360 digest enqueue.
        ManagerPeer360Digest:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /ai-review/manager/cycles/{cycleId}/subjects/{subjectUserId}/peer360-digest
            Method: POST
        # Option A: resolve the latest COMPLETED peer-360 digest by (subject, cycle)
        # so the UI reuses it on refresh. EXPLICIT route required — this API has no
        # {proxy+}, so without its own event API Gateway has no resource for the path
        # and the browser's CORS preflight 403s (surfacing as a 504 via the ngsw
        # service worker). The OPTIONS/CORS method is auto-added by the API Cors config.
        ManagerPeer360DigestLatest:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /ai-review/manager/cycles/{cycleId}/subjects/{subjectUserId}/peer360-digest/latest
            Method: GET
        # CC-6: admin cache invalidation knob. Both endpoints are gated by
        # isAdmin() in AiReviewResource — manager and employee get 403.
        # Per plan §6 decision 2: shipped prod-enabled from day one (no
        # Environment=dev conditional); admin RBAC is the only gate.
        CacheList:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /ai-review/cache
            Method: GET
        CacheDelete:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /ai-review/cache/{cacheKey}
            Method: DELETE

  # ---------------------------------------------------------------------------
  # Lambda: AI Worker  (G2 step 2)
  # Same JAR as AiServiceFunction but invoked with QUARKUS_LAMBDA_HANDLER=aiWorker
  # so Quarkus dispatches to AiWorkerHandler instead of the JAX-RS REST handler.
  #
  # Inert until step 3: AiServiceFunction.startAnalysis() still runs Gemini in
  # process. No SQS messages are produced yet, so this Lambda's event source has
  # nothing to consume.
  #
  # Timeout 60s (worker can exceed the 29s API Gateway ceiling — that's the whole
  # point of the split). Reserved concurrency caps Gemini quota burn during
  # bursty traffic.
  # ---------------------------------------------------------------------------
  AiWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !If [IsProd, "CatalystFlow-AiWorker", "CatalystFlow-AiWorker-dev"]
      CodeUri: ai-worker/target/function.zip
      # 540s: AiReviewService / ManagerGuidanceService.callGemini use a 500s
      # HTTP timeout + a 1s backoff retry on fast-failing transient errors.
      # Worst-case wall time is one 500s timeout (no retry on timeout) or a
      # ~1s fail-fast + ~500s retry — both fit inside 540s with a margin for
      # DDB writes and cold-start overhead. Was 60s; bumped 2026-05-17 after
      # job b4508ab5… hit the previous 25s HTTP cap on a normal INSIGHTS load.
      Timeout: 540
      MemorySize: 1024
      # 2026-05-20 (ConcurrentAIExecution): raised from 5 to 25 to lift the cycle-close
      # queue-drain time. Combined with BatchSize=10 below, peak in-flight Gemini calls
      # = 25 * 10 = 250. If Gemini quota tier returns 429s, dial back to 10-15 OR add
      # 429-aware retry in AiReviewService.callGemini (currently retries 5xx only).
      ReservedConcurrentExecutions: 0
      Environment:
        Variables:
          AI_JOBS_TABLE_NAME: !Ref AiJobsTable
          AI_JOBS_QUEUE_URL: !Ref AiJobsQueue
          GEMINI_API_KEY: !Ref GeminiApiKey
          GEMINI_MODEL: "gemini-2.5-flash"
          # Per-task models — must mirror the API block above. Worker + API
          # share the ModelResolver bean (via ai-service classpath import in
          # ai-worker/application.properties), so divergent values here would
          # break the cacheKey-stability invariant. Keep in lockstep.
          GEMINI_MODEL_ANALYZE: "gemini-3.1-flash-lite"
          # INSIGHTS/GOLDEN/DIGEST reverted to gemini-2.5-flash (2026-06-02) — all
          # three stream; see API block above. QUESTION_SUGGEST moved to 3.1-flash-lite.
          GEMINI_MODEL_INSIGHTS: "gemini-2.5-flash"
          GEMINI_MODEL_GOLDEN: "gemini-2.5-flash"
          GEMINI_MODEL_QUESTION_SUGGEST: "gemini-3.1-flash-lite"
          GEMINI_MODEL_DIGEST: "gemini-2.5-flash"
          # SPEC-503: per-task FALLBACK model (mirror of the API block above) —
          # re-run on an SQS redelivery after a transient 5xx. The worker is the
          # primary runtime path for runJobInProcess, so these drive the switch.
          GEMINI_MODEL_ANALYZE_FALLBACK: "gemini-2.5-flash"
          GEMINI_MODEL_INSIGHTS_FALLBACK: "gemini-2.5-flash"
          GEMINI_MODEL_GOLDEN_FALLBACK: "gemini-2.5-flash"
          GEMINI_MODEL_QUESTION_SUGGEST_FALLBACK: "gemini-2.5-flash"
          GEMINI_MODEL_DIGEST_FALLBACK: "gemini-2.5-flash"
          AI_REVIEW_MOCK: "false"
          # Worker dispatches the manager taskTypes (GOLDEN /
          # QUESTION_SUGGEST / PEER_360_DIGEST), which read reviews + templates
          # to build context. Without these env vars the worker falls back to
          # the @ConfigProperty defaults (prod table names) and the dev IAM
          # role denies access — exact symptom observed 2026-05-10 22:31.
          REVIEWS_TABLE_NAME: !Ref ReviewsTable
          REVIEW_TEMPLATES_TABLE_NAME: !Ref ReviewTemplatesTable
          # CC-1: shared cache table — worker also resolves cacheKey →
          # cacheName when running the AI flows. Same env var name as the API.
          GEMINI_CACHE_TABLE_NAME: !Ref GeminiContextCacheTable
          # CC-4a: worker runs the QUESTION_SUGGEST dispatch via SQS, so it
          # also needs the per-task flag. 2026-05-27: prod gate removed —
          # mirror the API block above. Worker + API must stay in lockstep
          # to avoid divergent cache behaviour between request entry
          # (API enqueues with no cache attempt) and worker dispatch
          # (worker opportunistically caches).
          GEMINI_CACHE_ENABLED_QUESTION_SUGGEST: "true"
          # CC-4b: same per-task flags as the API for GOLDEN + DIGEST.
          GEMINI_CACHE_ENABLED_GOLDEN: "true"
          GEMINI_CACHE_ENABLED_DIGEST: "true"
          # CC-4c: worker runs the ANALYZE + INSIGHTS dispatches via SQS,
          # so it also needs the per-task flags. Worker + API in lockstep.
          GEMINI_CACHE_ENABLED_ANALYZE: "true"
          GEMINI_CACHE_ENABLED_INSIGHTS: "true"
          # CC-5 (AC-11.2): same Stage tag as the API. Worker EMF lines feed
          # the same metric — keep dimensions consistent across both emitters.
          CATALYSTFLOW_STAGE: !Ref Environment
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AiJobsTable
        - SQSPollerPolicy:
            QueueName: !GetAtt AiJobsQueue.QueueName
        # Read access to reviews + templates for the manager-flow compute
        # helpers (queryCompletedByCycleType uses the SubjectIndex GSI; the
        # SAM DynamoDBReadPolicy grants Query on `<table>/index/*`).
        - DynamoDBReadPolicy:
            TableName: !Ref ReviewsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ReviewTemplatesTable
        # CC-1: Get/Put/Delete on the cache index — same scope as AiService.
        - DynamoDBCrudPolicy:
            TableName: !Ref GeminiContextCacheTable
      Events:
        JobsQueue:
          Type: SQS
          Properties:
            Enabled: false
            Queue: !GetAtt AiJobsQueue.Arn
            # 2026-05-20 (ConcurrentAIExecution): BatchSize 1 -> 10 to amortise
            # SQS poll + cold-start overhead across multiple jobs per invocation.
            # 2026-05-27 (latency push): Window 2 -> 0. The 2s wait was the
            # batching efficiency knob; for single-message arrivals (the common
            # case on interactive ANALYZE) it was just dead latency. Setting it
            # to 0 means Lambda invokes the moment any messages are available.
            # BatchSize stays 10: under cycle-close burst, the receive call can
            # still return up to 10 messages at once and they'll be batched —
            # we just no longer WAIT to fill the batch.
            # Handler fans out the 10 jobs in parallel via CompletableFuture
            # (AiWorkerHandler.java) so wall time per invocation stays near
            # max(per-message) rather than sum(per-message).
            # ReportBatchItemFailures stays on — only failed messageIds get
            # redelivered, successful ones inside the same batch are ack'd.
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 0
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # ---------------------------------------------------------------------------
  # 2026-05-27 (latency push): keep-warm pinger for AiWorker.
  #
  # Short polling on AiJobsQueue keeps the SQS event-source mapping continuously
  # active, but Lambda may still freeze the worker container after a few minutes
  # of no actual messages. A frozen container = cold-start on the first real
  # message. This EventBridge rule invokes AiWorkerFunction every 2 minutes
  # with a payload of `{"Records": []}` — the handler iterates Records, sees
  # zero, and returns SQSBatchResponse with no failures (AiWorkerHandler.java
  # line ~119). Net: no DDB writes, no Gemini calls, no log spam, ~50ms of
  # compute per ping. Cost: 720 invocations/day at 1024MB × 50ms ≈ $0.10/month.
  #
  # If a real cycle-close burst is in flight, the keep-warm invocation just
  # interleaves harmlessly — the handler is already idempotent and re-entrant.
  # ---------------------------------------------------------------------------
  AiWorkerKeepWarm:
    Type: AWS::Events::Rule
    Properties:
      Name: !If [IsProd, "CatalystFlow-AiWorker-KeepWarm", "CatalystFlow-AiWorker-KeepWarm-dev"]
      Description: "Keeps AiWorker container warm so the first interactive ANALYZE doesn't pay cold-start latency"
      ScheduleExpression: "rate(2 minutes)"
      State: DISABLED
      Targets:
        - Id: AiWorkerKeepWarmTarget
          Arn: !GetAtt AiWorkerFunction.Arn
          # SQSEvent with empty Records list — handler loops zero times and returns
          # an empty SQSBatchResponse. No DDB / no Gemini / no log spam.
          Input: '{"Records": []}'

  AiWorkerKeepWarmPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AiWorkerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AiWorkerKeepWarm.Arn

  # ---------------------------------------------------------------------------
  # Lambda: Notification Service
  # REST/API Lambda for manual reminders and status polling. Intent and delivery
  # queues are consumed by NotificationWorkerFunction to keep REST and custom SQS
  # handlers packaged separately, matching the AI service/worker split.
  # ---------------------------------------------------------------------------
  NotificationServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !If [IsProd, "CatalystFlow-NotificationService", "CatalystFlow-NotificationService-dev"]
      CodeUri: notification-service/target/function.zip
      Timeout: 29
      Environment:
        Variables:
          NOTIFICATION_JOBS_TABLE_NAME: !Ref NotificationJobsTable
          NOTIFICATION_JOBS_QUEUE_URL: !Ref NotificationJobsQueue
          REVIEWS_TABLE_NAME: !Ref ReviewsTable
          REVIEW_CYCLES_TABLE_NAME: !Ref ReviewCyclesTable
          USERS_TABLE_NAME: !Ref UsersTable
          NOTIFICATION_START_REMINDER_OFFSETS_DAYS: "7,0"
          NOTIFICATION_END_REMINDER_OFFSETS_DAYS: "14,7,3,1,0"
          NOTIFICATION_APP_BASE_URL: !If
            - IsProd
            - !Ref FrontendBaseUrl
            - !Ref FrontendBaseUrl
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NotificationJobsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ReviewsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ReviewCyclesTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt ReviewCyclesTable.Arn
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt NotificationJobsQueue.QueueName
      Events:
        ManualReminder:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /notifications/reminders/manual
            Method: POST
        NotificationJobStatus:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /notifications/jobs/{jobId}/status
            Method: GET

  # ---------------------------------------------------------------------------
  # Lambda: Notification Worker
  # Consumes notification intents (JSON) and delivery jobs (jobId strings).
  # Deterministic jobIds make duplicate intent delivery safe; the worker still
  # uses conditional PENDING -> PROCESSING claims before sending SES email.
  # ---------------------------------------------------------------------------
  NotificationWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !If [IsProd, "CatalystFlow-NotificationWorker", "CatalystFlow-NotificationWorker-dev"]
      CodeUri: notification-worker/target/function.zip
      Timeout: 300
      MemorySize: 512
      ReservedConcurrentExecutions: 0
      Environment:
        Variables:
          NOTIFICATION_JOBS_TABLE_NAME: !Ref NotificationJobsTable
          NOTIFICATION_JOBS_QUEUE_URL: !Ref NotificationJobsQueue
          NOTIFICATION_EVENTS_QUEUE_URL: !Ref NotificationEventsQueue
          REVIEWS_TABLE_NAME: !Ref ReviewsTable
          REVIEW_CYCLES_TABLE_NAME: !Ref ReviewCyclesTable
          USERS_TABLE_NAME: !Ref UsersTable
          NOTIFICATION_APP_BASE_URL: !If
            - IsProd
            - !Ref FrontendBaseUrl
            - !Ref FrontendBaseUrl
          NOTIFICATION_FROM_EMAIL: !Ref NotificationFromEmail
          NOTIFICATION_MAX_ATTEMPTS: "3"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NotificationJobsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ReviewsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ReviewCyclesTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - SQSPollerPolicy:
            QueueName: !GetAtt NotificationEventsQueue.QueueName
        - SQSPollerPolicy:
            QueueName: !GetAtt NotificationJobsQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt NotificationJobsQueue.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      Events:
        NotificationEvents:
          Type: SQS
          Properties:
            Enabled: false
            Queue: !GetAtt NotificationEventsQueue.Arn
            BatchSize: 1
            MaximumBatchingWindowInSeconds: 0
            FunctionResponseTypes:
              - ReportBatchItemFailures
        NotificationJobs:
          Type: SQS
          Properties:
            Enabled: false
            Queue: !GetAtt NotificationJobsQueue.Arn
            BatchSize: 1
            MaximumBatchingWindowInSeconds: 0
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # ---------------------------------------------------------------------------
  # Lambda: User Service
  # Handles all /users/* routes — manages users in Cognito + DynamoDB
  # ---------------------------------------------------------------------------
  UserServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !If [IsProd, "CatalystFlow-UserService", "CatalystFlow-UserService-dev"]
      CodeUri: user-service/target/function.zip
      Timeout: 29
      Environment:
        Variables:
          USERS_TABLE_NAME: !Ref UsersTable
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          # Local-dev escape hatch — gated by the AuthDisabledNotInProd Rule above so
          # this can never be "true" while Environment=prod.
          AUTH_DISABLED: !Ref AuthDisabled
          USER_INVITATIONS_ENABLED: "false"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        # Cognito admin permissions for user management there is no sam macrolike (DynamoDBCrudPolicy) so we use statement 
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
                - cognito-idp:AdminListGroupsForUser
                - cognito-idp:ListUsers
              Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"
      Events:
        # Public health check — no auth required
        UserHealthCheck:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /users/health
            Method: GET
            Auth:
              Authorizer: NONE

        # All other user routes — Cognito Authorizer (default)
        ListUsers:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /users
            Method: GET
        CreateUser:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /users
            Method: POST
        GetUser:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /users/{userId}
            Method: GET
        UpdateUser:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /users/{userId}
            Method: PUT
        GetUserPublic:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /users/{userId}/public
            Method: GET
        GetUserManager:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /users/{userId}/manager
            Method: GET
        GetManagerTeam:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /users/{userId}/team
            Method: GET

  # ---------------------------------------------------------------------------
  # Scheduler: Daily Australian Midnight Sync
  # Triggers NotificationServiceFunction directly with a "fake" API Gateway
  # event so cycle status maintenance and auto event reminder setup run together.
  # ---------------------------------------------------------------------------
  CycleMaintenanceSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !If [IsProd, "CatalystFlow-DailySync", "CatalystFlow-DailySync-dev"]
      Description: "Daily status sync at midnight Australian time"
      ScheduleExpression: "cron(0 0 * * ? *)"
      ScheduleExpressionTimezone: "Australia/Sydney"
      State: DISABLED
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt NotificationServiceFunction.Arn
        RoleArn: !GetAtt CycleMaintenanceSchedulerRole.Arn
        Input: |
          {
            "path": "/notifications/maintenance/daily",
            "httpMethod": "POST",
            "requestContext": {
              "path": "/notifications/maintenance/daily",
              "httpMethod": "POST"
            }
          }

  CycleMaintenanceSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt NotificationServiceFunction.Arn

  # ---------------------------------------------------------------------------
  # S3 Frontend Hosting (unchanged from original)
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # SSM parameters published for the E2E pipeline (no CloudFormation IAM needed
  # — CodeBuild E2E role already has SSM read on /catalystflow/*). Refreshed every
  # deploy. Names are env-scoped so prod and dev stacks coexist.
  # ---------------------------------------------------------------------------
  BackendApiUrlParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/catalystflow/${Environment}/backendApiUrl"
      Type: String
      Value: !Sub "https://${CatalystFlowApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
      Description: "API Gateway base URL — read by buildspec-e2e.yml"

  ReviewsTableNameParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/catalystflow/${Environment}/dynamodb/reviewsTable"
      Type: String
      Value: !Ref ReviewsTable

  ReviewCyclesTableNameParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/catalystflow/${Environment}/dynamodb/reviewCyclesTable"
      Type: String
      Value: !Ref ReviewCyclesTable

  ReviewTemplatesTableNameParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/catalystflow/${Environment}/dynamodb/reviewTemplatesTable"
      Type: String
      Value: !Ref ReviewTemplatesTable

  NotificationJobsTableNameParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/catalystflow/${Environment}/dynamodb/notificationJobsTable"
      Type: String
      Value: !Ref NotificationJobsTable


Outputs:
  # Single base URL used by the frontend — inject via CATALYSTFLOW_API_URL_PLACEHOLDER
  BackendApiUrl:
    Description: "API Gateway base URL for frontend injection"
    Value: !Sub "https://${CatalystFlowApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"

  ReviewServiceUrl:
    Description: "Review Service endpoints base"
    Value: !Sub "https://${CatalystFlowApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/reviews"

  UserServiceUrl:
    Description: "User Service endpoints base"
    Value: !Sub "https://${CatalystFlowApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/users"

  NotificationServiceUrl:
    Description: "Notification Service endpoints base"
    Value: !Sub "https://${CatalystFlowApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/notifications"

  AiJobsQueueUrl:
    Description: "SQS queue URL for AI worker jobs (G2)"
    Value: !Ref AiJobsQueue
    Export:
      Name: !Sub "${AWS::StackName}-AiJobsQueueUrl"

  AiJobsQueueArn:
    Description: "SQS queue ARN for AI worker jobs (G2)"
    Value: !GetAtt AiJobsQueue.Arn
    Export:
      Name: !Sub "${AWS::StackName}-AiJobsQueueArn"

  AiJobsDLQUrl:
    Description: "Dead-letter queue URL for AI jobs that failed 3 receive attempts"
    Value: !Ref AiJobsDLQ
    Export:
      Name: !Sub "${AWS::StackName}-AiJobsDLQUrl"

  NotificationEventsQueueUrl:
    Description: "SQS queue URL for notification business intents"
    Value: !Ref NotificationEventsQueue
    Export:
      Name: !Sub "${AWS::StackName}-NotificationEventsQueueUrl"

  NotificationJobsQueueUrl:
    Description: "SQS queue URL for notification delivery jobs"
    Value: !Ref NotificationJobsQueue
    Export:
      Name: !Sub "${AWS::StackName}-NotificationJobsQueueUrl"

  NotificationJobsDLQUrl:
    Description: "Dead-letter queue URL for notification delivery jobs"
    Value: !Ref NotificationJobsDLQ
    Export:
      Name: !Sub "${AWS::StackName}-NotificationJobsDLQUrl"
