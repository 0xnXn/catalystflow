AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CatalystFlow Serverless Infrastructure
  Dual Lambda architecture: ReviewService + UserService
  API Gateway REST API with Cognito JWT Authorizer

# what we are supplying to sam deploy command 
Parameters:
  FrontendBaseUrl:
    Type: String
    Description: HTTPS URL of this account's frontend distribution
    AllowedPattern: "https://.+"
  CognitoUserPoolId:
    Type: String
    Description: Existing Cognito User Pool ID
  LambdaRuntime:
    Type: String
    Default: provided.al2023
    AllowedValues: [provided.al2023, java21] 
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
    Description: Deployment Environment
  DevCloudFrontDistributionArn:
    Type: String
    Description: CloudFront distribution ID for dev frontend
  ProdCloudFrontDistributionArn:
    Type: String
    Description: CloudFront distribution ID for prod frontend
  GeminiApiKey:
    Type: String
    NoEcho: true
    Description: Gemini API key; empty while assistance is disabled
    Default: ""
  AuthDisabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Local-dev escape hatch: when "true", user-service ClaimsContext skips JWT
      validation and treats every caller as ADMIN+MANAGER. NEVER enable in prod —
      the Rules section below blocks the deploy if Environment=prod and this is true.
  NotificationFromEmail:
    Type: String
    Description: Verified SES sender; unused while notifications are disabled
    Default: "notifications@example.invalid"
Conditions:
  IsProd: !Equals [!Ref Environment, "prod"]

# Hard guard: refuse to deploy auth-disabled to prod. CloudFormation evaluates
# Rules before any resources are touched, so a misconfigured stack update fails
# fast with a clear message instead of silently shipping an unauthenticated API.
Rules:
  AuthDisabledNotInProd:
    RuleCondition: !Equals [!Ref Environment, "prod"]
    Assertions:
      - Assert: !Equals [!Ref AuthDisabled, "false"]
        AssertDescription: >
          AUTH_DISABLED must be "false" when deploying to prod.
          Refusing to deploy an unauthenticated API to a prod environment.
    
# setting a default for all the lamdas 
Globals:
  Function:
    Runtime: !Ref LambdaRuntime
    Handler: io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler::handleRequest
    MemorySize: 1024
    Environment:
      Variables:
        DISABLE_SIGNAL_HANDLERS: "true"


# resources is what we use to define what we need aws to create 
# always follows the same pattern - name type and props 
Resources:

  # ---------------------------------------------------------------------------
  # API Gateway 
  # ---------------------------------------------------------------------------
  CatalystFlowApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !If [IsProd, "CatalystFlow-API", "CatalystFlow-API-dev"]
      StageName: !Ref Environment
      Auth:
        ResourcePolicy:
          CustomStatements:
            - Effect: Allow
              Principal: '*'
              Action: execute-api:Invoke
              Resource: execute-api:/*
            - Effect: Deny
              Principal: '*'
              Action: execute-api:Invoke
              Resource:
                - execute-api:/*/*/ai-review/analyze*
                - execute-api:/*/*/ai-review/insights*
                - execute-api:/*/*/ai-review/manager/*
                - execute-api:/*/*/ai-review/cache*
                - execute-api:/*/*/notifications/*
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            # Validates the JWT from the Authorization header against this User Pool , !sub is used to substitute ${} with the value
            UserPoolArn: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # ---------------------------------------------------------------------------
  # Gateway Responses
  # API Gateway strips CORS headers from its own error responses (401, 403).
  # Without these, the browser sees a CORS failure instead of the actual error,
  # causing "Failed to fetch" in Swagger UI and the Angular frontend.
  # ---------------------------------------------------------------------------
  GatewayResponseUnauthorized:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref CatalystFlowApi
      ResponseType: UNAUTHORIZED
      StatusCode: "401"
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
      ResponseTemplates:
        application/json: |
          {
            "error": {
              "code": "UNAUTHORIZED",
              "message": "Authorization token is missing or invalid."
            }
          }

  GatewayResponseAccessDenied:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref CatalystFlowApi
      ResponseType: ACCESS_DENIED
      StatusCode: "403"
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
      ResponseTemplates:
        application/json: |
          {
            "error": {
              "code": "FORBIDDEN",
              "message": "You do not have permission to perform this action."
            }
          }

  # ---------------------------------------------------------------------------
  # DynamoDB Tables
  # ---------------------------------------------------------------------------
  ReviewsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !If [IsProd, "CatalystFlow_Reviews", "CatalystFlow_Reviews_dev"]
      AttributeDefinitions:
        - AttributeName: reviewId
          AttributeType: S
        - AttributeName: subjectUserId
          AttributeType: S
        - AttributeName: authorUserId
          AttributeType: S
        - AttributeName: cycleId
          AttributeType: S
        - AttributeName: cycleTypeKey   # "{cycleId}#{reviewType}" — GSI sort key
          AttributeType: S
      KeySchema:
        - AttributeName: reviewId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: SubjectIndex
          KeySchema:
            - AttributeName: subjectUserId
              KeyType: HASH
            - AttributeName: cycleTypeKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: AuthorIndex
          KeySchema:
            - AttributeName: authorUserId
              KeyType: HASH
            - AttributeName: cycleTypeKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: CycleIndex
          KeySchema:
            - AttributeName: cycleId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !If [IsProd, "CatalystFlow_Users", "CatalystFlow_Users_dev"]
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  ReviewCyclesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !If [IsProd, "CatalystFlow_ReviewCycles", "CatalystFlow_ReviewCycles_dev"]
      AttributeDefinitions:
        - AttributeName: cycleId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: startDate
          AttributeType: S
      KeySchema:
        - AttributeName: cycleId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-startDate-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: startDate
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  AiJobsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !If [IsProd, "CatalystFlow_AiJobs", "CatalystFlow_AiJobs_dev"]
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
        # Peer-360 digest resolve-by-(subject,cycle). Sparse GSI keys — written
        # only by AiJobRepository.createForDigest (PEER_360_DIGEST jobs).
        - AttributeName: digestKey
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: N
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        # Resolve the latest COMPLETED digest for a (subject, cycle) without a
        # review-stored pointer. Sparse (only digest rows carry digestKey) → tiny
        # on PAY_PER_REQUEST. INCLUDE status so the resolve query filters
        # COMPLETED without a second read.
        - IndexName: Peer360DigestIndex
          KeySchema:
            - AttributeName: digestKey
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - status
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  NotificationJobsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !If [IsProd, "CatalystFlow_NotificationJobs", "CatalystFlow_NotificationJobs_dev"]
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ── G2: AI worker queue ──────────────────────────────────────────────────────
  # The API Lambda enqueues a job (jobId-only body); the worker Lambda consumes
  # the queue and runs Gemini. After maxReceiveCount=3 failed processing attempts
  # a message moves to AiJobsDLQ and a CloudWatch alarm pages the on-call.
  #
  # Visibility timeout = 6× worker Lambda timeout (60s × 6 = 360s) per AWS guidance —
  # avoids duplicate processing on slow Gemini calls.
  # MessageRetentionPeriod 86400s (1 day) — if no worker has picked up a job within
  # a day, the request is stale (the user has long since closed the tab).
  AiJobsDLQ:
    Type: AWS::SQS::Queue
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !If [IsProd, "catalystflow-ai-jobs-dlq", "catalystflow-ai-jobs-dlq-dev"]
      MessageRetentionPeriod: 1209600   # 14 days (max) — operators need time to investigate

  AiJobsQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !If [IsProd, "catalystflow-ai-jobs", "catalystflow-ai-jobs-dev"]
      # 2026-05-20 (ConcurrentAIExecution): lowered 3240 -> 810 (1.5× worker
      # Timeout=540s). The previous 6× was a "very safe" default that pre-dates
      # tryClaim — double-processing is now blocked at the data layer
      # (AiJobRepository.tryClaim is a DDB conditional update; the loser drops
      # the message without burning Gemini quota). 1.5× keeps a comfortable
      # buffer over the worker's hard 540s timeout while cutting:
      #   - worker-crash recovery: 54 min -> 13.5 min
      #   - worst-case time-to-DLQ:  162 min -> 40.5 min
      # 429-specific deferred-retry uses ChangeMessageVisibility to override
      # this default with the Gemini Retry-After value (typically 30-60s).
      VisibilityTimeout: 810           # 1.5× worker timeout (worker Timeout = 540s)
      MessageRetentionPeriod: 86400     # 1 day
      # 2026-05-27 (latency push): short polling. With long polling at 5s, the
      # first message after an idle window still waited up to 5s for an active
      # poller's receive call to return. Setting this to 0 makes Lambda's
      # event-source mapping use short polling — each ReceiveMessage returns
      # immediately, and AWS's poller loops continuously. Trade-off: ~5M extra
      # SQS receive API calls/day (~$2/month) for sub-second PENDING dwell on
      # the interactive ANALYZE flow. Pollers stay continuously active so they
      # don't scale down on quiet queues either — a side benefit.
      ReceiveMessageWaitTimeSeconds: 0
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AiJobsDLQ.Arn
        maxReceiveCount: 3

  # G2 step 5: page operators when a message reaches the DLQ. A single message in
  # the DLQ means a job nobody could process in 3 attempts — almost always either
  # a Gemini quota exhaustion, a malformed request that bypassed validation, or a
  # bug in the worker. Threshold=1 so the first failure alerts.
  #
  # AlarmActions intentionally left empty — wire to an SNS topic + on-call rotation
  # in a follow-up. Until then the alarm still transitions to ALARM state and is
  # visible in the CloudWatch console / dashboards.
  AiJobsDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !If [IsProd, "CatalystFlow-AiJobsDLQ-NonEmpty", "CatalystFlow-AiJobsDLQ-NonEmpty-dev"]
      AlarmDescription: "AI worker dead-letter queue has at least one unprocessed job"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Statistic: Maximum
      Period: 300                       # 5min granularity matches SQS metric publish rate
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AiJobsDLQ.QueueName

  # ── CC-5 AC-11.3: cache hit-rate watchdog ────────────────────────────────────
  # Plan §D5: a Gemini context cache is only economical when hit-rate beats the
  # break-even (cache storage cost / per-call saving). Threshold 0.3 — below
  # that we should re-evaluate TTL or disable the task's cache flag.
  #
  # Why Metric Math (not raw Average): the metric is emitted on EVERY Gemini
  # call, with CacheHit=0 / Cacheable=0 on non-cacheable calls (no per-task
  # cache flag set). A raw Average(CacheHit) across all calls would always
  # be near-zero in early rollout — non-cacheable traffic drowns out the
  # cacheable subset. SUM(CacheHit) / SUM(Cacheable) measures ONLY the
  # cacheable calls' hit ratio, which is the right break-even denominator.
  #
  # IF wrapper handles zero-division: when no cacheable calls happened in the
  # window, return 1 (treat as healthy) so an idle service doesn't false-page.
  # Combined with TreatMissingData: notBreaching, this means the alarm only
  # fires when there IS cacheable traffic AND its hit rate is genuinely low.
  #
  # Dimension: stage only — matches the stage-only metric definition that
  # GeminiClient.emitCacheMetric emits alongside the per-task one. Org-wide
  # signal per stage; per-task slicing lives on the dashboard.
  #
  # AlarmActions empty — same pattern as the AiJobsDLQAlarm above. Wire to
  # SNS + on-call when the broader alarm-to-pager rollout lands.
  CacheHitRateLowAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !If [IsProd, "CatalystFlow-Ai-CacheHitRate-Low", "CatalystFlow-Ai-CacheHitRate-Low-dev"]
      AlarmDescription: "Gemini cache hit-rate < 0.3 over 1h (cacheable calls only) — review TTL or disable per-task flag"
      EvaluationPeriods: 1
      Threshold: 0.3
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      Metrics:
        - Id: cacheHits
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: CatalystFlow/AI
              MetricName: CacheHit
              Dimensions:
                - Name: stage
                  Value: !Ref Environment
            Period: 3600
            Stat: Sum
        - Id: cacheable
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: CatalystFlow/AI
              MetricName: Cacheable
              Dimensions:
                - Name: stage
                  Value: !Ref Environment
            Period: 3600
            Stat: Sum
        - Id: hitRate
          # IF(cacheable > 0, hits/cacheable, 1) — zero-cacheable means "no
          # cacheable traffic", which is healthy by definition. Without the
          # guard, an idle hour would divide-by-zero (CW: NaN) and the alarm
          # would go INSUFFICIENT_DATA repeatedly.
          Expression: "IF(cacheable > 0, cacheHits / cacheable, 1)"
          Label: "Cache hit ratio (cacheable calls only)"
          ReturnData: true

  # ── CC-1: Gemini context-cache index ─────────────────────────────────────────
  # Maps a content-hashed cacheKey (taskType + promptVersion + sha256(prompt)
  # + discipline + seniority) to a Gemini cachedContents/<id> resource name.
  # Lookup-or-create flow lives in GeminiCacheService (CC-2):
  #
  #   1. GetItem(cacheKey)
  #   2. If hit AND expiresAt > now+60s → reuse cacheName, send to Gemini
  #      as {"cachedContent": "<cacheName>"} which prepends the cached
  #      prefix without paying for those input tokens again.
  #   3. If miss/expired → POST /v1beta/cachedContents to create, PutItem
  #      the new (cacheKey, cacheName, expiresAt) row.
  #
  # Why DDB and not Caffeine: Lambda invocations are stateless across cold
  # starts. A fresh cold start would otherwise re-create the same Gemini
  # cache → double-billing on cache storage. DDB lookup is ~5 ms; Gemini
  # cache creation is ~500 ms — well worth the trip.
  #
  # expiresAt is a TTL attribute so DDB sweeps expired rows automatically.
  # The value tracks Gemini's own TTL (set per task type in GeminiCacheService);
  # CC-6 admin invalidation endpoints can also DeleteItem manually.
  GeminiContextCacheTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !If [IsProd, "CatalystFlow_GeminiContextCache", "CatalystFlow_GeminiContextCache_dev"]
      AttributeDefinitions:
        - AttributeName: cacheKey
          AttributeType: S
      KeySchema:
        - AttributeName: cacheKey
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ── Notification intent + delivery queues ───────────────────────────────────
  # Review-service publishes lightweight business intents here instead of
  # invoking notification-service directly. The notification worker resolves
  # intents into deterministic NotificationJobs, then enqueues per-email delivery
  # jobIds on NotificationJobsQueue.
  NotificationEventsDLQ:
    Type: AWS::SQS::Queue
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !If [IsProd, "catalystflow-notification-events-dlq", "catalystflow-notification-events-dlq-dev"]
      MessageRetentionPeriod: 1209600

  NotificationEventsQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !If [IsProd, "catalystflow-notification-events", "catalystflow-notification-events-dev"]
      VisibilityTimeout: 900
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationEventsDLQ.Arn
        maxReceiveCount: 3

  NotificationJobsDLQ:
    Type: AWS::SQS::Queue
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !If [IsProd, "catalystflow-notification-jobs-dlq", "catalystflow-notification-jobs-dlq-dev"]
      MessageRetentionPeriod: 1209600

  NotificationJobsQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !If [IsProd, "catalystflow-notification-jobs", "catalystflow-notification-jobs-dev"]
      VisibilityTimeout: 900
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationJobsDLQ.Arn
        maxReceiveCount: 3

  NotificationEventsDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !If [IsProd, "CatalystFlow-NotificationEventsDLQ-NonEmpty", "CatalystFlow-NotificationEventsDLQ-NonEmpty-dev"]
      AlarmDescription: "Notification intent dead-letter queue has at least one unprocessed intent"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: QueueName
          Value: !GetAtt NotificationEventsDLQ.QueueName

  NotificationJobsDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !If [IsProd, "CatalystFlow-NotificationJobsDLQ-NonEmpty", "CatalystFlow-NotificationJobsDLQ-NonEmpty-dev"]
      AlarmDescription: "Notification delivery dead-letter queue has at least one unprocessed job"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: QueueName
          Value: !GetAtt NotificationJobsDLQ.QueueName

  ReviewTemplatesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !If [IsProd, "CatalystFlow_ReviewTemplates", "CatalystFlow_ReviewTemplates_dev"]
      AttributeDefinitions:
        - AttributeName: templateId
          AttributeType: S
        - AttributeName: reviewType
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
        - AttributeName: templateName
          AttributeType: S
      KeySchema:
        - AttributeName: templateId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: reviewType-createdAt-index
          KeySchema:
            - AttributeName: reviewType
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: templateName-index
          KeySchema:
            - AttributeName: templateName
              KeyType: HASH
          Projection:
            ProjectionType: KEYS_ONLY
      BillingMode: PAY_PER_REQUEST

  # ---------------------------------------------------------------------------
  # Cognito Groups — all 3 managed by this stack (prod only).
  # Both stacks share the same Cognito pool — only prod owns group creation.
  #
  # ADMIN:    Imported from manually-created group (DeletionPolicy: RetainExceptOnCreate protects
  #           existing users — never delete this group via CF).
  # MANAGER:  Delete manually from Cognito console before first deploy.
  # EMPLOYEE: CF renames the old USER group automatically.
  # ---------------------------------------------------------------------------
  CognitoAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Condition: IsProd
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      UserPoolId: !Ref CognitoUserPoolId
      GroupName: ADMIN
      Description: Full administrative access

  CognitoManagerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Condition: IsProd
    Properties:
      UserPoolId: !Ref CognitoUserPoolId
      GroupName: MANAGER
      Description: Manager group — elevated access to direct reports

  CognitoEmployeeGroup:
    Type: AWS::Cognito::UserPoolGroup
    Condition: IsProd
    Properties:
      UserPoolId: !Ref CognitoUserPoolId
      GroupName: EMPLOYEE
      Description: Standard authenticated employee group


  # ---------------------------------------------------------------------------
  # Lambda: Review Service
  # Handles all /reviews/* routes
  # ---------------------------------------------------------------------------
  ReviewServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !If [IsProd, "CatalystFlow-ReviewService", "CatalystFlow-ReviewService-dev"]
      CodeUri: review-service/target/function.zip
      Timeout: 29
      Environment:
        Variables:
          REVIEWS_TABLE_NAME: !Ref ReviewsTable
          REVIEW_CYCLES_TABLE_NAME: !Ref ReviewCyclesTable
          REVIEW_TEMPLATES_TABLE_NAME: !Ref ReviewTemplatesTable
          USERS_TABLE_NAME: !Ref UsersTable
          NOTIFICATION_EVENTS_QUEUE_URL: !Ref NotificationEventsQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReviewsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ReviewCyclesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ReviewTemplatesTable
        # Read-only on UsersTable — required for peer-360 assignment validation
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt NotificationEventsQueue.QueueName
      Events:
        # events are basically where we initiate or trigger the Lamda here is where we write the API 
        ReviewHealthCheck:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi #we call in the API GATEWAY REFERENCE and we conntect it with lamda 
            Path: /reviews/health
            Method: GET
            Auth:
              Authorizer: NONE #no auth is req by default we beed auth 

        ListReviews:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /reviews
            Method: GET
        CreateReview:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /reviews
            Method: POST
        GetReview:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /reviews/{reviewId}
            Method: GET
        UpdateReview:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /reviews/{reviewId}
            Method: PUT
        DeleteReview:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /reviews/{reviewId}
            Method: DELETE
        GetMyReviews:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /reviews/my-review
            Method: GET
        GetReviewsAssignedToMe:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /reviews/assigned-to-me
            Method: GET
        GetReviewsByCycle:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /reviews/cycle/{cycleId}
            Method: GET
        GetManagerGate:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /reviews/manager-gate
            Method: GET
        PublishReviewBundle:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /reviews/bundle/publish
            Method: POST
        ReviewCycleHealthCheck:
          Type: Api
          Properties:
            RestApiId: !Ref CatalystFlowApi
            Path: /cycles/health
            Method: GET
            Auth:
              Authorizer: NONE
