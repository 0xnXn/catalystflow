        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiReviewInsightsRequest'
      responses:
        '202':
          description: AI review insights accepted — poll the status endpoint for results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiReviewJobResponse'
        '400':
          description: Missing or invalid request fields
        '401':
          description: Unauthorized

  /ai-review/insights/{jobId}/status:
    get:
      tags: [AI Review]
      summary: Poll asynchronous AI review insights status
      operationId: getAiReviewInsightsStatus
      security:
        - CognitoAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current AI review insights status, with result when completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiReviewInsightsStatusResponse'
        '401':
          description: Unauthorized
        '404':
          description: AI review job not found

  # ── Manager guidance endpoints (G3 — async via SQS) ──────────────────────
  # All three POSTs enqueue a job and return 202 + UUID jobId. Frontend polls
  # /ai-review/manager/jobs/{jobId}/status until the row is COMPLETED. Pattern
  # matches /analyze and /insights but uses a loose-typed status endpoint
  # because each manager taskType produces a different result shape.
  #
  # Result shapes by taskType (frontend casts based on which start* it called):
  #   - MANAGER_GOLDEN          → ManagerGoldenReview
  #   - MANAGER_QUESTION_SUGGEST→ QuestionSuggestResult
  #   - PEER_360_DIGEST         → Peer360Digest

  /ai-review/manager/jobs/{jobId}/status:
    get:
      tags: [AI Review]
      summary: Poll the status of any manager-flow AI job
      description: |
        Returns the cached job row with the raw result JSON object. The result
        shape depends on the job's taskType — see the descriptions on the three
        manager POST endpoints. This endpoint is loose-typed (`result: object`)
        because the strict `/analyze/{jobId}/status` endpoint binds results into
        `AiReviewResponse` which would silently drop non-analyze fields.
      operationId: getManagerJobStatus
      security:
        - CognitoAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current manager job status, with result when COMPLETED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerJobStatusResponse'
        '401': { description: Unauthorized }
        '403': { description: Caller is not an admin or manager }
        '404': { description: AI job not found }
  /ai-review/manager/reviews/{reviewId}/golden:
    post:
      tags: [AI Review]
      summary: Enqueue a polished "golden" rewrite of a manager's draft review
      operationId: managerGolden
      security:
        - CognitoAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Job enqueued — poll the status endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiReviewJobResponse'
        '401': { description: Unauthorized }
        '403': { description: Caller is not an admin or manager }
        '500': { description: Failed to persist or enqueue the job }

  /ai-review/manager/cycles/{cycleId}/subjects/{subjectUserId}/peer360-digest:
    post:
      tags: [AI Review]
      summary: Enqueue a peer-360 digest for the manager view
      description: |
        Clusters every completed PEER_360 row for this (cycleId, subjectUserId)
        pair into themes / consensus / dissent / overall sentiment. Returns
        202 + jobId; the frontend polls /ai-review/manager/jobs/{jobId}/status.
        Result shape is Peer360Digest. ADR-2.
      operationId: managerPeer360Digest
      security:
        - CognitoAuth: []
      parameters:
        - name: cycleId
          in: path
          required: true
          schema: { type: string }
        - name: subjectUserId
          in: path
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Job enqueued — poll the status endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiReviewJobResponse'
        '400': { description: Missing cycleId or subjectUserId }
        '401': { description: Unauthorized }
        '403': { description: Caller is not an admin or manager }
        '500': { description: Failed to persist or enqueue the job }

  /ai-review/manager/reviews/{reviewId}/question-suggest:
    post:
      tags: [AI Review]
      summary: Enqueue a per-question Gemini suggestion
      operationId: managerQuestionSuggest
      security:
        - CognitoAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionSuggestRequest'
      responses:
        '202':
          description: Job enqueued — poll the status endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiReviewJobResponse'
        '400':
          description: Missing or invalid request fields (questionId, questionText, managerCurrentAnswer, discipline, seniority, employeeReview.answers)
        '401': { description: Unauthorized }
        '403': { description: Caller is not an admin or manager }
        '500': { description: Failed to persist or enqueue the job }

  # ── CC-6: Gemini context-cache admin (admin-only) ───────────────────────────
  # Operator escape hatch for the CatalystFlow_GeminiContextCache table. The
  # DELETE endpoint is the manual invalidation knob when a bad cache row is
  # poisoning suggestions; the GET endpoint is the cache inventory view for
  # ops triage. Admin RBAC is the only gate — both prod and dev. Per plan
  # §6 decision 2: "prod-enabled from day one; admin is the gate".
  /ai-review/cache:
    get:
      tags: [AI Review]
      summary: List all entries in the Gemini context-cache index (admin)
      description: |
        Returns every row in the CatalystFlow_GeminiContextCache table — both
        real cache rows (entryType=CACHE pointing at a live Gemini
        cachedContents/<id>) and tombstones (entryType=UNDER_THRESHOLD,
        used to memoise the "too small to cache" decision per §D6).
        Expired rows clean themselves via DDB TTL, so this view is the
        live working set.

        **Scope**: row inventory + per-entry cached-token count + DDB TTL
        info only. Per-entry hit-rate / hit-count stats are NOT in this
        response (CC-6 AC-12.2 originally promised "hit-rate stats" but
        was revised in the round-3 follow-up — per-entry hit tracking
        requires DDB counter updates on every cache hit which we don't
        ship today). Aggregate hit-rate IS available — see CloudWatch
        namespace `CatalystFlow/AI`, metrics `CacheHit` and `Cacheable`,
        sliced by `taskType` and `stage` dimensions. The
        `CatalystFlow-Ai-CacheHitRate-Low` alarm watches the SUM ratio.
      operationId: listCacheEntries
      security:
        - CognitoAuth: []
      responses:
        '200':
          description: All current cache entries (real + tombstones)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheEntryListResponse'
        '401': { description: Unauthorized }
        '403': { description: Caller is not an admin }
        '500': { description: DDB scan failed }
  /ai-review/cache/{cacheKey}:
    delete:
      tags: [AI Review]
      summary: Invalidate a single Gemini cache entry (admin)
      description: |
        Hard-delete the cache row and, when applicable, the upstream Gemini
        cachedContents resource. For tombstones (entryType=UNDER_THRESHOLD)
        the Gemini DELETE is skipped — no upstream resource exists, so
        calling Gemini DELETE would 404. For real cache rows the upstream
        DELETE is best-effort: a 404 from Gemini (TTL already expired) is
        logged and ignored; the DDB row is removed regardless so the next
        resolveOrCreate forces a fresh create.
      operationId: deleteCacheEntry
      security:
        - CognitoAuth: []
      parameters:
        - name: cacheKey
          in: path
          required: true
          schema: { type: string }
          description: |
            The full cacheKey as returned by GET /ai-review/cache —
            taskType#promptVersion#sha256_16(content)#discipline#seniority.
      responses:
        '204': { description: Entry deleted (DDB + best-effort upstream Gemini) }
        '401': { description: Unauthorized }
        '403': { description: Caller is not an admin }
        '404': { description: No cache entry with that cacheKey }
        '500': { description: DDB delete failed (Gemini upstream failure does NOT 500) }
