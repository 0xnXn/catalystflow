          schema:
            type: string
      responses:
        '200':
          description: Current AI review analysis status, with result when completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiReviewStatusResponse'
        '401':
          description: Unauthorized
        '404':
          description: AI review job not found

  /ai-review/insights:
    post:
      tags: [AI Review]
      summary: Start asynchronous generation of self-review summary and golden mirror
      operationId: generateAiReviewInsights
      security:
        - CognitoAuth: []
      requestBody:
