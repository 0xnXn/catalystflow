# DynamoDB table names — injected by SAM as environment variables
reviews.table-name=${REVIEWS_TABLE_NAME:CatalystFlow_Reviews}
review-cycles.table-name=${REVIEW_CYCLES_TABLE_NAME:CatalystFlow_ReviewCycles}
review-templates.table-name=${REVIEW_TEMPLATES_TABLE_NAME:CatalystFlow_ReviewTemplates}
# Cross-service: read-only access to UsersTable for peer-360 assignment validation
users.table-name=${USERS_TABLE_NAME:CatalystFlow_Users}
# DynamoDB client config
quarkus.dynamodb.aws.region=${AWS_DEFAULT_REGION:ap-southeast-2}
quarkus.dynamodb.devservices.enabled=false
quarkus.sqs.aws.region=${AWS_DEFAULT_REGION:ap-southeast-2}
quarkus.sqs.devservices.enabled=false
notification-events.queue-url=${NOTIFICATION_EVENTS_QUEUE_URL:}

# Jackson — exclude null fields so response-projection helpers (BaseResource
# strip* methods) actually drop sensitive fields from the wire instead of
# serializing "field": null. Mirrors user-service config.
quarkus.jackson.serialization-inclusion=non-null
