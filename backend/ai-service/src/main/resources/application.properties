# ai-service — runs the AI Review endpoints (split from review-service in Epic 5 G1).
#
# DynamoDB client config
quarkus.dynamodb.aws.region=${AWS_DEFAULT_REGION:ap-southeast-2}
quarkus.dynamodb.devservices.enabled=false

# Gemini API — set GEMINI_API_KEY in environment / SAM template (free tier at aistudio.google.com)
gemini.api-key=${GEMINI_API_KEY:}
# Global Gemini model fallback. Kept as the middle tier of the three-tier
# resolution below — per-task GEMINI_MODEL_<TASK> env vars override this; if
# none is set, gemini.model wins; if even GEMINI_MODEL is unset, the literal
# default kicks in. Existing behavior is preserved when only GEMINI_MODEL is
# configured (all tasks see the same value, cacheKey unchanged).
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# Per-task model resolution. Each task can be flipped independently via a
# SAM env var (GEMINI_MODEL_ANALYZE, GEMINI_MODEL_INSIGHTS, etc.) without a
# code redeploy. The three-tier fallback (per-task env → global env → literal)
# guarantees every property resolves to a non-blank value, which the
# ModelResolver verifies before returning to callers. CacheRequest.model is
# part of the cacheKey hash, so changing a task's model invalidates its cache
# rows on next call (intentional — different model = different output even
# on the same prefix).
gemini.model.analyze=${GEMINI_MODEL_ANALYZE:${GEMINI_MODEL:gemini-2.5-flash}}
gemini.model.insights=${GEMINI_MODEL_INSIGHTS:${GEMINI_MODEL:gemini-2.5-flash}}
gemini.model.golden=${GEMINI_MODEL_GOLDEN:${GEMINI_MODEL:gemini-2.5-flash}}
gemini.model.question-suggest=${GEMINI_MODEL_QUESTION_SUGGEST:${GEMINI_MODEL:gemini-2.5-flash}}
gemini.model.digest=${GEMINI_MODEL_DIGEST:${GEMINI_MODEL:gemini-2.5-flash}}

# SPEC-503: per-task FALLBACK model, re-run on an SQS redelivery after a
# transient upstream 5xx (ModelResolver.fallbackModelFor). Each defaults to its
# own primary above when GEMINI_MODEL_<TASK>_FALLBACK is unset, so the feature
# is inert (fallback == primary, cacheKey unchanged) until a fallback is set.
gemini.model.analyze.fallback=${GEMINI_MODEL_ANALYZE_FALLBACK:${gemini.model.analyze}}
gemini.model.insights.fallback=${GEMINI_MODEL_INSIGHTS_FALLBACK:${gemini.model.insights}}
gemini.model.golden.fallback=${GEMINI_MODEL_GOLDEN_FALLBACK:${gemini.model.golden}}
gemini.model.question-suggest.fallback=${GEMINI_MODEL_QUESTION_SUGGEST_FALLBACK:${gemini.model.question-suggest}}
gemini.model.digest.fallback=${GEMINI_MODEL_DIGEST_FALLBACK:${gemini.model.digest}}

# Set AI_REVIEW_MOCK=true locally to skip the LLM call and return fake suggestions
ai-review.mock=${AI_REVIEW_MOCK:false}
coaching.mock=${COACHING_MOCK:false}
# Metadata-only LLM logs are always emitted. Enable this only during diagnosis:
# it logs short redacted Gemini response previews, never full prompts.
ai-review.log-llm-previews=${AI_REVIEW_LOG_LLM_PREVIEWS:false}

# AI job state — DynamoDB table
ai-jobs.table-name=${AI_JOBS_TABLE_NAME:CatalystFlow_AiJobs}

# Retention (days) for a job's TTL once it COMPLETES — replaces the short ~7-day
# creation TTL so a finalized review keeps its AI well past any realistic revisit
# (no silent Gemini re-fire). PENDING/FAILED jobs keep the short creation TTL.
ai-jobs.completed-ttl-days=${AI_JOBS_COMPLETED_TTL_DAYS:365}

# CC-1: Gemini context-cache index — maps cacheKey -> Gemini cachedContents/<id>.
# CC-2's GeminiCacheService.resolveOrCreate reads/writes this table. Falls back
# to the prod table name when GEMINI_CACHE_TABLE_NAME is unset so local sam
# without explicit overrides still resolves to a real table.
gemini-cache.table-name=${GEMINI_CACHE_TABLE_NAME:CatalystFlow_GeminiContextCache}

# Reviews and templates tables — read by manager guidance endpoints
reviews.table-name=${REVIEWS_TABLE_NAME:CatalystFlow_Reviews}
review-templates.table-name=${REVIEW_TEMPLATES_TABLE_NAME:CatalystFlow_ReviewTemplates}

# G2 — SQS client (only used when AI_JOBS_QUEUE_URL is set; safe no-op otherwise)
quarkus.sqs.aws.region=${AWS_DEFAULT_REGION:ap-southeast-2}
quarkus.sqs.devservices.enabled=false
# ai-jobs.queue-url is optional — when unset, AiReviewService falls back to in-process
# execution. SAM sets AI_JOBS_QUEUE_URL in deployed environments.
ai-jobs.queue-url=${AI_JOBS_QUEUE_URL:}

# Native image resource inclusion for classpath JSON/text assets loaded at runtime.
quarkus.native.resources.includes=performance-criteria.json,style-references.json,manager-style-references.v2-sectioned.json,golden-reviews/*
