# ai-worker — SQS-triggered Lambda that runs Gemini for AI review jobs (Epic 5 G2).
#
# Same DynamoDB table as ai-service. Worker reads requestJson, calls Gemini,
# writes resultJson back. No HTTP endpoints — invocations come via SQS only.

quarkus.lambda.handler=aiWorker

# Index ai-service so its CDI beans (AiReviewService, AiJobRepository, ...) are
# discoverable from the worker JAR.
quarkus.index-dependency.ai-service.group-id=com.catalystflow
quarkus.index-dependency.ai-service.artifact-id=ai-service

# DynamoDB
quarkus.dynamodb.aws.region=${AWS_DEFAULT_REGION:ap-southeast-2}
quarkus.dynamodb.devservices.enabled=false
ai-jobs.table-name=${AI_JOBS_TABLE_NAME:CatalystFlow_AiJobs}

# CC-1: same Gemini context-cache table as the API. Worker also resolves
# cacheKey -> Gemini cachedContents/<id> when running AI jobs.
gemini-cache.table-name=${GEMINI_CACHE_TABLE_NAME:CatalystFlow_GeminiContextCache}

# Gemini — same vars the API used pre-G2
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
# Per-task model resolution — keep worker in lockstep with ai-service
# (both inject ModelResolver, both must see the same per-task config).
gemini.model.analyze=${GEMINI_MODEL_ANALYZE:${GEMINI_MODEL:gemini-2.5-flash}}
gemini.model.insights=${GEMINI_MODEL_INSIGHTS:${GEMINI_MODEL:gemini-2.5-flash}}
gemini.model.golden=${GEMINI_MODEL_GOLDEN:${GEMINI_MODEL:gemini-2.5-flash}}
gemini.model.question-suggest=${GEMINI_MODEL_QUESTION_SUGGEST:${GEMINI_MODEL:gemini-2.5-flash}}
gemini.model.digest=${GEMINI_MODEL_DIGEST:${GEMINI_MODEL:gemini-2.5-flash}}
# SPEC-503: per-task FALLBACK model (re-run on SQS redelivery after a transient
# 5xx). Worker is the primary runtime path for ModelResolver.fallbackModelFor,
# so these MUST resolve here too. Keep in lockstep with ai-service. Each defaults
# to its own primary when GEMINI_MODEL_<TASK>_FALLBACK is unset → feature inert.
gemini.model.analyze.fallback=${GEMINI_MODEL_ANALYZE_FALLBACK:${gemini.model.analyze}}
gemini.model.insights.fallback=${GEMINI_MODEL_INSIGHTS_FALLBACK:${gemini.model.insights}}
gemini.model.golden.fallback=${GEMINI_MODEL_GOLDEN_FALLBACK:${gemini.model.golden}}
gemini.model.question-suggest.fallback=${GEMINI_MODEL_QUESTION_SUGGEST_FALLBACK:${gemini.model.question-suggest}}
gemini.model.digest.fallback=${GEMINI_MODEL_DIGEST_FALLBACK:${gemini.model.digest}}
ai-review.mock=${AI_REVIEW_MOCK:false}
